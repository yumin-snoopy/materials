<!doctype html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4RX7JMCQLZ"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-4RX7JMCQLZ');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webデザイン練習スタジオ | Web制作教材</title>
  <link rel="stylesheet" href="./style.css?v=1">
  <script src="./script.js?v=1" defer></script>
  <script src="../source-guard.js" defer></script>
</head>
<body>
  <header class="hero"><div class="hero-inner"><p class="eyebrow">見た目からCSSを学ぶ</p><h1>Webデザイン練習スタジオ</h1><p>好きなデザインを作りながら、HTMLとCSSのつながりを確かめましょう。</p><a href="../student.html">Web教材一覧へ戻る</a></div></header>
  <main class="app">
    <div class="topbar" role="group" aria-label="作成モード"><button type="button" class="mode active" data-mode="free" aria-pressed="true">自由に作る</button><button type="button" class="mode" data-mode="challenge" aria-pressed="false">お題に挑戦</button><span id="status" role="status" aria-live="polite"></span></div>
    <div class="workspace">
      <section class="panel settings" aria-labelledby="settings-title"><div class="panel-heading"><div><p class="step">01 / DESIGN</p><h2 id="settings-title">デザイン設定</h2></div></div>
        <label class="main-label" for="part">作るパーツ</label><select id="part"><option value="button">ボタン</option><option value="card">カード</option><option value="heading">見出し</option><option value="nav">ナビゲーション</option><option value="image">画像付きカード</option></select>
        <div class="theme-box"><label class="main-label" for="theme">配色プリセット</label><select id="theme"><option value="">配色を選ぶ</option><option value="pink">やさしいピンク</option><option value="blue">爽やかなブルー</option><option value="green">ナチュラルグリーン</option><option value="beige">落ち着いたベージュ</option><option value="mono">シンプルモノトーン</option></select><a href="../color_palette/">配色・色見本教材を見る</a></div>
        <div id="controls"></div>
        <div class="save-actions"><button type="button" id="save">現在の設定を保存</button><button type="button" id="load">保存したデザインを読み込み</button><button type="button" id="reset">初期状態に戻す</button></div>
      </section>
      <section class="panel preview-panel" aria-labelledby="preview-title"><div class="panel-heading"><div><p class="step">02 / PREVIEW</p><h2 id="preview-title">リアルタイムプレビュー</h2></div></div>
        <div class="device-switch" role="group" aria-label="プレビューの表示幅"><button type="button" data-device="pc" aria-pressed="true">PC</button><button type="button" data-device="tablet" aria-pressed="false">タブレット</button><button type="button" data-device="phone" aria-pressed="false">スマートフォン</button></div>
        <div class="preview-scroll"><div class="preview-shell" id="preview-shell"><iframe id="preview" title="現在のデザインのプレビュー" sandbox="allow-same-origin"></iframe></div></div><p class="preview-note">表示幅を変えても、生成するコードには同じデザイン設定が使われます。</p>
        <section id="challenge" class="challenge" hidden><div class="challenge-top"><div><p class="step">CHALLENGE</p><h3 id="challenge-title"></h3></div><span id="challenge-result" aria-live="polite"></span></div><p id="challenge-description"></p><p class="mini-title">完成見本</p><div class="target-shell"><iframe id="target" title="お題の完成見本" sandbox="allow-same-origin"></iframe></div><div class="challenge-actions"><button type="button" id="hint-button">ヒントを見る</button><button type="button" id="answer-button">答えを見る</button><button type="button" id="next-button">次のお題</button></div><p id="challenge-help" aria-live="polite"></p></section>
      </section>
    </div>
    <section class="panel code-panel" aria-labelledby="code-title"><div class="panel-heading"><div><p class="step">03 / CODE</p><h2 id="code-title">できあがりのコード</h2></div><p>変更するとコードも自動で更新されます。</p></div><div class="code-grid"><div class="code-block"><div class="code-head"><h3>HTML</h3><button type="button" data-copy="html">HTMLをコピー</button></div><pre><code id="html-code"></code></pre></div><div class="code-block"><div class="code-head"><h3>CSS</h3><button type="button" data-copy="css">CSSをコピー</button></div><pre><code id="css-code"></code></pre></div></div><div class="export-actions"><button type="button" id="copy-all">HTML＋CSSをコピー</button><button type="button" id="download">HTMLファイルをダウンロード</button></div></section>
  </main>
</body>
</html>
