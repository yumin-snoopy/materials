<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScriptサンプル集 | Web制作教材</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/samples.js?v=20261030b" defer></script>
  <script src="js/script.js" defer></script>
  <script src="js/guard.js" defer></script>
</head>
<body>
  <header class="site-head">
    <div><p class="eyebrow">WEB 制作教材</p><h1>JavaScriptサンプル集</h1><p>動きを試し、必要なコードをコピーして自分のページに加えましょう。</p></div>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">サンプル一覧を開く</button>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="サンプル一覧">
      <label for="search">サンプルを探す</label>
      <input id="search" type="search" placeholder="例：メニュー、入力、色" autocomplete="off">
      <p id="search-count" class="search-count" role="status"></p>
      <nav id="menu" aria-label="サンプル選択"></nav>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <div class="item-meta"><span id="category" class="tag"></span><span id="number"></span></div>
      <h2 id="title"></h2>
      <div class="intro-grid"><section class="info-card"><h3>どんな機能？</h3><p id="description"></p></section><section class="info-card"><h3>いつ使う？</h3><p id="usage"></p></section></div>
      <section class="panel preview-panel" aria-labelledby="preview-title"><div class="panel-head"><h3 id="preview-title">操作できるプレビュー</h3><div id="preview-options"></div></div><div class="preview-stage"><iframe id="preview" title="サンプルのプレビュー" sandbox="allow-scripts allow-same-origin allow-forms"></iframe></div></section>
      <section class="panel" aria-labelledby="code-title"><h3 id="code-title">組み込み用コード</h3><p>HTMLは <code>&lt;body&gt;</code> 内に、CSSは <code>css/style.css</code> に、JavaScriptは <code>js/script.js</code> に追加します。</p><p><code>&lt;head&gt;</code> 内で <code>&lt;script src="js/script.js" defer&gt;&lt;/script&gt;</code> を読み込みます。パスは自分のフォルダ構成に合わせて変更してください。</p><div class="code-tabs" role="tablist" aria-label="コードの種類"><button type="button" role="tab" data-kind="html" aria-selected="true">HTML</button><button type="button" role="tab" data-kind="css" aria-selected="false">CSS</button><button type="button" role="tab" data-kind="js" aria-selected="false">JavaScript</button></div><div id="code-panel" role="tabpanel"><div class="code-toolbar"><span id="code-label">HTML</span><button id="copy" type="button">コードをコピー</button></div><pre><code id="code"></code></pre></div><p id="copy-status" role="status" aria-live="polite"></p></section>
      <div class="intro-grid"><section class="info-card"><h3>コードのポイント</h3><p id="explanation"></p></section><section class="info-card"><h3>自分の作品で変えるところ</h3><p id="customize"></p></section></div>
    </main>
  </div>
</body>
</html>
