<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web制作教材一覧 | materials</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #273444; background: #f7fbfc; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 980px; margin: auto; padding: clamp(24px, 5vw, 64px); }
    .eyebrow { color: #446c83; font-weight: 700; letter-spacing: .08em; }
    h1 { font-size: clamp(2rem, 4vw, 3rem); margin: .3em 0; }
    p { font-size: 1.12rem; line-height: 1.75; }
    .list { display: grid; gap: 18px; margin-top: 36px; }
    .card { background: white; border: 1px solid #d8e6ec; border-radius: 20px; padding: 26px; box-shadow: 0 8px 30px #2544610d; }
    .card h2 { margin: 0; font-size: 1.55rem; }
    .button { display: inline-block; background: #286b82; color: white; font-weight: 700; padding: 12px 22px; border-radius: 12px; text-decoration: none; }
    .button:hover, .button:focus-visible { background: #174d61; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">WEB 制作教材</p>
    <h1>Web制作教材一覧</h1>
    <p>HTMLやCSSのしくみを、操作しながら学べる教材をまとめています。</p>
    <div class="list">
      <!-- 新しい教材は、このカードを複製して追加します。 -->
      <article class="card">
        <h2>CSSボックスモデル体験ツール</h2>
        <p>width・height、内側の余白、枠線、外側の余白を変え、実際のサイズを確かめましょう。練習問題もあります。</p>
        <a class="button" href="./css_box_model/">教材を開く</a>
      </article>
    </div>
  </main>
</body>
</html>
