<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教材一覧</title>
  <style>
    body {
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      margin: 0;
      background: #f7f8fa;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .lead {
      text-align: center;
      color: #666;
      margin-bottom: 40px;
    }

    .material-section + .material-section {
      margin-top: 46px;
    }

    .section-title {
      margin: 0 0 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #d9dee8;
      font-size: 1.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .card p {
      color: #555;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      background: #0969da;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      background: #0757b7;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>教材一覧</h1>
    <p class="lead">学びたい分野を選んでください。</p>
    <section class="material-section" aria-labelledby="study-title">
      <h2 class="section-title" id="study-title">学習分野</h2>
      <div class="cards">
        <div class="card"><h3>VBA</h3><p>If文・For文の基礎練習と、VBAエキスパート対策の教材をまとめています。</p><a class="button" href="./VBA/">教材一覧を開く</a></div>
        <div class="card"><h3>FE（基本情報技術者試験）</h3><p>科目Bの5種類のソートアルゴリズムを、数値の動き・説明・疑似コードで学びます。</p><a class="button" href="./fe/">教材一覧を開く</a></div>
      </div>
    </section>
    <section class="material-section" aria-labelledby="web-title">
      <h2 class="section-title" id="web-title">Web</h2>
      <div class="cards">
        <div class="card">
          <h3>スライドショー</h3>
          <p>HTML・CSS・JavaScriptを使ったスライドショー教材です。</p>
          <a class="button" href="./slideshow/">教材を開く</a>
        </div>
      </div>
    </section>

    <section class="material-section" aria-labelledby="security-title">
      <h2 class="section-title" id="security-title">情報セキュリティ</h2>
      <div class="cards">
        <div class="card">
          <h3>ハッシュ値確認</h3>
          <p>1文字の変更でハッシュ値が変わることを体験し、データの改ざん検知や整合性確認について学びます。</p>
          <a class="button" href="./security/hash_demo/">教材を開く</a>
        </div>
      </div>
    </section>

    <footer>materials</footer>
  </main>
</body>
</html>
