<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生成AIの用語カード｜第1章・試作版</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="../../assets/source-guard.js" defer></script>
  <script src="js/terms.js?v=1" defer></script>
  <script src="js/script.js?v=2" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="intro">
      <p class="eyebrow">生成AIパスポート講座｜第1章・試作版</p>
      <h1>生成AIの用語カード</h1>
      <p>用語を見て意味を思い出してから、「説明を見る」を押しましょう。</p>
    </header>
    <section class="panel" aria-label="学習設定">
      <label for="filter">表示するカード</label>
      <div class="controls">
        <select id="filter"><option value="all">すべて</option><option value="unseen">未学習</option><option value="retry">もう一度</option><option value="known">覚えた</option></select>
        <button id="shuffle" type="button" class="secondary">順番をシャッフル</button>
      </div>
      <p class="hint">絞り込みやシャッフルを変えると、新しい一巡が始まります。</p>
      <div class="counts" aria-live="polite"><span>未学習 <strong id="unseenCount">0</strong>件</span><span>もう一度 <strong id="retryCount">0</strong>件</span><span>覚えた <strong id="knownCount">0</strong>件</span></div>
    </section>
    <section class="study" aria-live="polite">
      <p id="position" class="position"></p>
      <article id="card" class="card" aria-labelledby="term">
        <p class="card-label">用語</p>
        <h2 id="term"></h2>
        <button id="reveal" type="button">説明を見る</button>
        <div id="details" hidden>
          <div class="detail"><h3>やさしい意味</h3><p id="meaning"></p></div>
          <div class="detail"><h3>身近な具体例</h3><p id="example"></p></div>
          <div class="detail"><h3>覚えるポイント</h3><p id="point"></p></div>
          <p id="related" class="related" hidden></p>
          <div class="answers"><button id="retry" type="button" class="retry">もう一度：復習する</button><button id="known" type="button" class="known">覚えた：学習済みにする</button></div>
        </div>
      </article>
      <div id="finish" class="card finish" hidden><h2 id="finishTitle"></h2><p id="finishText"></p><button id="restart" type="button">もう一巡する</button><button id="retryOnly" type="button" class="secondary">「もう一度」を復習する</button></div>
      <nav id="cardNav" class="card-nav" aria-label="用語カードの移動"><button id="previous" type="button" class="secondary">前の単語</button><button id="next" type="button" class="secondary">次の単語</button></nav>
      <p id="skipHint" class="hint">説明を見ずに移動しても、学習状況は変わりません。</p>
    </section>
    <footer><p id="storageNote">学習状況は、この端末のブラウザに保存されます。</p><button id="reset" type="button" class="text-button">学習状況をリセット</button><p><a href="../">教材一覧へ戻る</a></p></footer>
  </main>
</body>
</html>
