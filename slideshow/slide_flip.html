<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>フリップ切り替えスライドショー</title>
  <style>
    /* スライドショーの表示エリア */
    #slideshow {
      width: 800px;
      height: 600px;
      margin: 0 auto;
      perspective: 1000px; /* 3D効果を出すための視点距離 */
      overflow: hidden;
    }

    /* スライドを重ねて配置するコンテナ */
    .flip-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* 各スライド画像の共通スタイル */
    .flip-slide {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* 背面を非表示に */
      transition: transform 1s ease-in-out; /* 回転のアニメーション */
      opacity: 0;  /* 最初は非表示 */
      transform: rotateY(180deg); /* 初期状態：裏向き */
    }

    /* 表示中の画像 */
    .flip-slide.active {
      opacity: 1;                    /* 表示 */
      transform: rotateY(0deg);      /* 表面を見せる */
      z-index: 1;                    /* 最前面 */
    }
  </style>
  <link rel="stylesheet" href="source-viewer.css">
</head>
<body>

<h2>フリップ切り替えスライドショー</h2>

<div id="slideshow">
  <div class="flip-container">
    <img src="./images/pic1.png" class="flip-slide active">
    <img src="./images/pic2.png" class="flip-slide">
    <img src="./images/pic3.png" class="flip-slide">
    <img src="./images/pic4.png" class="flip-slide">
    <img src="./images/pic5.png" class="flip-slide">
    <img src="./images/pic6.png" class="flip-slide">
  </div>
</div>

<div class="source-tools">
  <button class="source-toggle" type="button" data-source-toggle aria-expanded="false" aria-controls="sourcePanel">ソースを表示</button>
</div>

<section class="source-panel" id="sourcePanel" hidden>
  <h3 class="source-heading">このサンプルのソースコード</h3>
  <pre class="source-pre"><code class="source-code" id="sourceCode"></code></pre>
</section>

<script>
  const slides = document.querySelectorAll('.flip-slide');
  let currentIndex = 0;

  setInterval(() => {
    // 現在のスライドを非表示にし、裏向きに
    slides[currentIndex].classList.remove('active');

    // 次のスライドのインデックスを取得
    currentIndex = (currentIndex + 1) % slides.length;

    // 次のスライドを表示（回転して表向きに）
    slides[currentIndex].classList.add('active');
  }, 4000); // 4秒ごとにフリップ切り替え
</script>
<script src="source-viewer.js"></script>

</body>
</html>
