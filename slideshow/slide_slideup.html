<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>スライドアップ スライドショー</title>
  <style>
    /* 表示領域の枠 */
    #slideshow {
      width: 800px;
      height: 600px;
      margin: 0 auto;
      overflow: hidden;
      position: relative; /* 子要素を重ねる基準 */
    }

    /* 全ての画像を重ねる共通設定 */
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0; /* 最初は透明 */
      transform: translateY(50px); /* 下から登場 */
      transition: opacity 1s ease, transform 1s ease; /* 動きを滑らかに */
    }

    /* 表示中の画像 */
    .slide.active {
      opacity: 1;             /* 表示 */
      transform: translateY(0); /* 通常位置に戻る */
      z-index: 1;             /* 前面に表示 */
    }
  </style>
  <link rel="stylesheet" href="source-viewer.css">
</head>
<body>

<h2>スライドアップ スライドショー</h2>

<div id="slideshow">
  <img src="./images/pic1.png" class="slide active">
  <img src="./images/pic2.png" class="slide">
  <img src="./images/pic3.png" class="slide">
  <img src="./images/pic4.png" class="slide">
  <img src="./images/pic5.png" class="slide">
  <img src="./images/pic6.png" class="slide">
</div>

<div class="source-tools">
  <button class="source-toggle" type="button" data-source-toggle aria-expanded="false" aria-controls="sourcePanel">ソースを表示</button>
</div>

<section class="source-panel" id="sourcePanel" hidden>
  <h3 class="source-heading">このサンプルのソースコード</h3>
  <pre class="source-pre"><code class="source-code" id="sourceCode"></code></pre>
</section>

<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;

  setInterval(() => {
    // 現在のスライドを非表示に
    slides[current].classList.remove('active');

    // 次のスライド番号を取得
    current = (current + 1) % slides.length;

    // 次のスライドを表示にする
    slides[current].classList.add('active');
  }, 4000); // 4秒ごとに切り替え
</script>
<script src="source-viewer.js"></script>

</body>
</html>
