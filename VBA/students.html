<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VBA 練習ページ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #243247; font-family: "Yu Gothic", "Meiryo", sans-serif; line-height: 1.8; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 20px; }
    header { margin-bottom: 32px; }
    .label { color: #0969da; font-weight: bold; margin: 0; }
    h1 { margin: 8px 0 12px; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.4; }
    .lead { margin: 0; color: #526078; }
    .notice { margin: 24px 0 36px; padding: 18px 20px; background: #eaf2ff; border-radius: 12px; }
    h2 { margin: 0 0 18px; font-size: 1.3rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
    .card { padding: 26px; background: #fff; border: 1px solid #dce3ee; border-radius: 16px; }
    .number { margin: 0; color: #526078; font-size: .9rem; }
    h3 { margin: 8px 0; font-size: 1.4rem; }
    .card p { margin: 0 0 16px; }
    .button { display: inline-block; padding: 12px 20px; background: #0969da; color: #fff; font-weight: bold; text-decoration: none; border-radius: 8px; }
    .button:hover { background: #0757b7; }
    .button:focus-visible { outline: 3px solid #243247; outline-offset: 4px; }
    footer { margin-top: 36px; color: #526078; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="label">授業の復習</p>
      <h1>VBA 練習ページ</h1>
      <p class="lead">授業で習った内容を、練習問題で確認しましょう。</p>
    </header>
    <p class="notice">このページをブックマークしておきましょう。授業が進むと、練習できる教材がこのページに追加されます。</p>
    <section aria-labelledby="practice-title">
      <h2 id="practice-title">いま練習できる教材</h2>
      <!-- 授業で扱った教材を、以下の cards 内に追加します。配布URLは変更しません。 -->
      <div class="cards">
        <article class="card">
          <p class="number">01 · 条件分岐</p>
          <h3>IF文の練習</h3>
          <p>条件によって処理がどう変わるか、コードを上から順番に追って確認します。</p>
          <a class="button" href="./vba_if_practice/">IF文を練習する</a>
        </article>
        <article class="card">
          <p class="number">02 · 繰り返し</p>
          <h3>FOR文の練習</h3>
          <p>繰り返しの回数と変数の変化を確認します。IF文と組み合わせた処理も復習できます。</p>
          <a class="button" href="./vba_for_practice/">FOR文を練習する</a>
        </article>
      </div>
    </section>
    <footer>わからない問題は、授業のノートやコードを確認しながら取り組みましょう。</footer>
  </main>
</body>
</html>
